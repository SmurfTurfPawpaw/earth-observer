name: Refresh discovery metadata

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: intelligence-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'SmurfTurfPawpaw/earth-observer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INTELLIGENCE_OUTPUT: .cache/intelligence-snapshots
      NODE_OPTIONS: --max-old-space-size=256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check snapshot contract
        run: node --test server/hosted/gdelt-snapshot.test.mjs
      - name: Generate one bounded latest GKG topic sample
        id: generate
        run: node scripts/gdelt-snapshot.mjs "$INTELLIGENCE_OUTPUT"
      - name: Preserve prior metadata when upstream is unavailable
        if: steps.generate.outputs.status == 'skipped'
        run: echo 'The generation step reported an upstream limit or invalid response. The previously published snapshot remains in place.'
      - name: Publish bounded latest metadata
        if: steps.generate.outputs.status == 'generated'
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view intelligence-data --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create intelligence-data --repo "$GH_REPO" --target "$GITHUB_SHA" --latest=false \
              --title 'Latest discovery metadata' \
              --notes 'A bounded rolling sample from the latest publicly downloadable GDELT GKG batch each scheduled run. Source links, reviewed topic codes and country mentions only; topic labels are generated, not original headlines. Exact processed batches, missing intervals and retrieval times are recorded. No article text, images or asserted event coordinates are copied. Country mentions and machine topics do not verify publisher claims.'
          fi
          gh release upload intelligence-data "$INTELLIGENCE_OUTPUT/gdelt.snapshot.json" --repo "$GH_REPO" --clobber

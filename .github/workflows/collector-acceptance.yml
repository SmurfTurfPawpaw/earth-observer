name: Hosted collection deployment acceptance

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Finite acceptance duration
        type: choice
        default: '20'
        options: ['10', '20', '30']

permissions:
  contents: read

concurrency:
  group: hosted-earth-collector
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'SmurfTurfPawpaw/earth-observer' && github.ref == 'refs/heads/main' && vars.EARTH_HOSTED_COLLECTOR_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Allow a prior collection admission to settle
        run: sleep 61
      - name: Exercise the existing collect-only capability
        env:
          EARTH_TRIGGER_HMAC_KEY: ${{ secrets.EARTH_TRIGGER_HMAC_KEY }}
          EARTH_ACCEPTANCE_MINUTES: ${{ inputs.minutes }}
        run: node scripts/collector-acceptance.mjs
